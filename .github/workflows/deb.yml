name: Debian packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and lint the package
        run: packaging/build-deb.sh "$GITHUB_WORKSPACE/out"
      - name: Artifact name
        id: name
        run: echo "name=deb-$(echo '${{ matrix.image }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/*.deb
          if-no-files-found: error

  install-test:
    name: Install test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Artifact name
        id: name
        run: echo "name=deb-$(echo '${{ matrix.image }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.name.outputs.name }}
          path: out
      - name: Install, check and purge on a clean system
        run: |
          for deb in out/*.deb; do packaging/test-deb.sh "$deb"; done

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/icinga2_splunk/__init__.py)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: out
          merge-multiple: true
      - name: Make file names safe for GitHub
        # GitHub turns "~" in asset names into ".", so "2.0.0~deb12" would be
        # published as "2.0.0.deb12". Use "_" instead; the package version
        # inside the .deb keeps the "~".
        run: |
          for deb in out/*.deb; do
            mv -v "$deb" "${deb//\~/_}"
          done
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.deb --clobber
