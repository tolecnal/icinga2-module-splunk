/**
 * Splunk Integration Feature Configuration
 *
 * This is an alternative configuration using Icinga2's
 * PerfdataWriter feature to write to files that can be
 * processed by a separate daemon or monitored by Splunk Universal Forwarder
 */

library "perfdata"

object PerfdataWriter "splunk-perfdata" {
  host_perfdata_path = "/var/spool/icinga2/splunk/host-perfdata"
  service_perfdata_path = "/var/spool/icinga2/splunk/service-perfdata"

  host_format_template = "DATATYPE::HOSTPERFDATA\tTIMET::$icinga.timet$\tHOSTNAME::$host.name$\tHOSTPERFDATA::$host.perfdata$\tHOSTCHECKCOMMAND::$host.check_command$\tHOSTSTATE::$host.state$\tHOSTSTATETYPE::$host.state_type$"

  service_format_template = "DATATYPE::SERVICEPERFDATA\tTIMET::$icinga.timet$\tHOSTNAME::$host.name$\tSERVICEDESC::$service.name$\tSERVICEPERFDATA::$service.perfdata$\tSERVICECHECKCOMMAND::$service.check_command$\tSERVICESTATE::$service.state$\tSERVICESTATETYPE::$service.state_type$"

  rotation_interval = 15s
  rotation_method = "DAILY"
}
