/**
 * Icinga2 Splunk Integration Configuration
 * 
 * This configuration enables sending both event data (state changes)
 * and performance data (metrics) to Splunk via HTTP Event Collector
 */

/**
 * Configuration constants for Splunk HEC
 * Update these values for your Splunk instance
 */
const SplunkHecUrl = "https://splunk.example.com:8088"
const SplunkHecToken = "your-hec-token-here"
const SplunkVerifySSL = "true"
const SplunkScriptPath = "/usr/local/bin/icinga2_splunk"

/**
 * EventCommand for sending host state changes to Splunk
 */
object EventCommand "splunk-host-event" {
  command = [ SplunkScriptPath + "/event_handler.py" ]
  
  env = {
    "SPLUNK_HEC_URL" = SplunkHecUrl
    "SPLUNK_HEC_TOKEN" = SplunkHecToken
    "SPLUNK_VERIFY_SSL" = SplunkVerifySSL
    "ICINGA2_EVENT_TYPE" = "host"
    "ICINGA2_HOSTNAME" = "$host.name$"
    "ICINGA2_HOSTSTATE" = "$host.state$"
    "ICINGA2_HOSTSTATETYPE" = "$host.state_type$"
    "ICINGA2_HOSTATTEMPT" = "$host.check_attempt$"
    "ICINGA2_HOSTOUTPUT" = "$host.output$"
    "ICINGA2_LASTHOSTSTATE" = "$host.last_state$"
    "ICINGA2_LASTHOSTSTATECHANGE" = "$host.last_state_change$"
    "ICINGA2_HOSTDOWNTIMEDEPTH" = "$host.downtime_depth$"
    "ICINGA2_HOSTACKNOWLEDGEMENT" = "$host.acknowledgement$"
  }
}

/**
 * EventCommand for sending service state changes to Splunk
 */
object EventCommand "splunk-service-event" {
  command = [ SplunkScriptPath + "/event_handler.py" ]
  
  env = {
    "SPLUNK_HEC_URL" = SplunkHecUrl
    "SPLUNK_HEC_TOKEN" = SplunkHecToken
    "SPLUNK_VERIFY_SSL" = SplunkVerifySSL
    "ICINGA2_EVENT_TYPE" = "service"
    "ICINGA2_HOSTNAME" = "$host.name$"
    "ICINGA2_SERVICENAME" = "$service.name$"
    "ICINGA2_SERVICESTATE" = "$service.state$"
    "ICINGA2_SERVICESTATETYPE" = "$service.state_type$"
    "ICINGA2_SERVICEATTEMPT" = "$service.check_attempt$"
    "ICINGA2_SERVICEOUTPUT" = "$service.output$"
    "ICINGA2_LASTSERVICESTATE" = "$service.last_state$"
    "ICINGA2_LASTSERVICESTATECHANGE" = "$service.last_state_change$"
    "ICINGA2_SERVICEDOWNTIMEDEPTH" = "$service.downtime_depth$"
    "ICINGA2_SERVICEACKNOWLEDGEMENT" = "$service.acknowledgement$"
  }
}

/**
 * EventCommand for sending host performance data to Splunk
 */
object EventCommand "splunk-host-perfdata" {
  command = [ SplunkScriptPath + "/perfdata_handler.py" ]
  
  env = {
    "SPLUNK_HEC_URL" = SplunkHecUrl
    "SPLUNK_HEC_TOKEN" = SplunkHecToken
    "SPLUNK_VERIFY_SSL" = SplunkVerifySSL
    "ICINGA2_DATA_TYPE" = "host"
    "ICINGA2_HOSTNAME" = "$host.name$"
    "ICINGA2_HOSTPERFDATA" = "$host.perfdata$"
    "ICINGA2_HOSTCHECKCOMMAND" = "$host.check_command$"
  }
}

/**
 * EventCommand for sending service performance data to Splunk
 */
object EventCommand "splunk-service-perfdata" {
  command = [ SplunkScriptPath + "/perfdata_handler.py" ]
  
  env = {
    "SPLUNK_HEC_URL" = SplunkHecUrl
    "SPLUNK_HEC_TOKEN" = SplunkHecToken
    "SPLUNK_VERIFY_SSL" = SplunkVerifySSL
    "ICINGA2_DATA_TYPE" = "service"
    "ICINGA2_HOSTNAME" = "$host.name$"
    "ICINGA2_SERVICENAME" = "$service.name$"
    "ICINGA2_SERVICEPERFDATA" = "$service.perfdata$"
    "ICINGA2_SERVICECHECKCOMMAND" = "$service.check_command$"
  }
}

/**
 * Apply event handlers to all hosts
 * This will send state changes to Splunk
 */
apply EventCommand "splunk-host-event" to Host {
  // Send events on state changes (not SOFT states by default)
  assign where host.state_type == StateTypeHard
}

/**
 * Apply event handlers to all services
 * This will send state changes to Splunk
 */
apply EventCommand "splunk-service-event" to Service {
  // Send events on state changes (not SOFT states by default)
  assign where service.state_type == StateTypeHard
}

/**
 * Apply performance data handlers to all hosts with perfdata
 */
apply EventCommand "splunk-host-perfdata" to Host {
  assign where host.perfdata
}

/**
 * Apply performance data handlers to all services with perfdata
 */
apply EventCommand "splunk-service-perfdata" to Service {
  assign where service.perfdata
}

